<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bestill workshop | CRAFTSVILLA</title>
  <link rel="stylesheet" href="stil.css">
</head>
<body>
  <header class="rad">
    <a class="logo" href="index.html"><img src="assets/blomst.png" alt="">CRAFTSVILLA</a>
    <nav aria-label="Hovedmeny">
      <a href="index.html#workshops">Workshops</a>
      <a href="index.html#om-oss">Om oss</a>
      <a href="bestilling.html">Bestilling</a>
    </nav>
  </header>

  <main class="bestilling">
    <h1>Bestill workshop</h1>
    <p>Velg en workshop og en dato som passer for dere.</p>

    <form id="bestillingsskjema">
      <label for="navn">Navn</label>
      <input id="navn" name="navn" type="text" autocomplete="name" required>

      <label for="epost">E-post</label>
      <input id="epost" name="epost" type="email" autocomplete="email" required>

      <label for="workshop">Workshop</label>
      <select id="workshop" name="workshop" required>
        <option value="">Velg workshop</option>
        <option>Mosaikkunst – 400 kr</option>
        <option>Akvarellmaling – 200 kr</option>
        <option>Lerretsmaling – 300 kr</option>
      </select>

      <label for="dato">Ønsket dato</label>
      <input id="dato" name="dato" type="date" required>

      <label for="antall">Antall deltakere</label>
      <input id="antall" name="antall" type="number" min="1" value="1" required>

      <button class="knapp" type="submit">Send bestilling</button>
      <p id="svar" role="status"></p>
    </form>
  </main>

  <footer>
    <div class="rad">
      <a class="logo" href="index.html"><img src="assets/blomst.png" alt="">CRAFTSVILLA</a>
      <a href="mailto:hei@craftsvilla.example">hei@craftsvilla.example</a>
      <div class="ikoner">
        <img src="assets/instagram.png" alt="Instagram">
        <img src="assets/facebook.png" alt="Facebook">
      </div>
    </div>
  </footer>

  <script>
    // Vis en melding når alle feltene er gyldige.
    const skjema = document.getElementById("bestillingsskjema");
    skjema.addEventListener("submit", function (hendelse) {
      hendelse.preventDefault();
      skjema.reset();
      document.getElementById("svar").textContent = "Takk! Du har prøvd skjemaet. Dette er en demobestilling.";
    });
  </script>
</body>
</html>
